<script>
(async () => {
  function findNS(k) { for (const n of Object.getOwnPropertyNames(window)) { try { const v = window[n]; if (v && typeof v === 'object' && typeof v[k] === 'function') return v; } catch (e) {} } return null; }

  if (!NS) { NS = {}; for (const f of ["../core/Button.jsx","../content/Stat.jsx","Modal.jsx"]) { let s = await (await fetch(f)).text(); const names = [...s.matchAll(/export function (\w+)/g)].map((m) => m[1]); s = 'const {useState,useEffect,useRef}=React;\n' + s.replace(/import\b[\s\S]*?from\s*["'][^"']+["'];?/g, '').replace(/export\s+default\s+/g, '').replace(/export\s+(const|let|class)\s+/g, '$1 ').replace(/export function/g, 'function') + '\n' + names.map((n) => 'NS.' + n + '=' + n + ';').join(''); new Function('React', 'NS', Babel.transform(s, { presets: [['react', { runtime: 'classic' }]] }).code)(React, NS); } }
