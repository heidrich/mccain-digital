<!-- @dsCard group="Motion" viewport="700x170" subtitle="Stripe-Rhythmus: kurz für Micro, lang und ausklingend für Kacheln" name="Easing & Dauern" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:#fff;color:var(--text-heading)}.g{display:grid;gap:12px}.sw{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(10,37,64,.06)}.l{font:500 11px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l b{display:block;font:600 12px/1.4 var(--font-sans);color:var(--text-heading)}.b{display:flex;align-items:center;gap:12px;margin-top:8px}.dot{width:14px;height:14px;border-radius:50%;background:#0A1F44;animation:mv 2.4s infinite}.tr{flex:1;height:2px;background:#E3E8EE;position:relative}.tr .dot{position:absolute;top:-6px;left:0}@keyframes mv{0%,15%{left:0}70%,100%{left:calc(100% - 14px)}}</style></head><body><div class="b"><div class="l" style="margin:0;width:230px"><b>Micro .2s · ease-out</b>--dur-micro</div><div class="tr"><div class="dot" style="animation-timing-function:cubic-bezier(.2,.8,.2,1)"></div></div></div><div class="b"><div class="l" style="margin:0;width:230px"><b>Lift .45s · ease-out</b>--dur-lift</div><div class="tr"><div class="dot" style="animation-timing-function:cubic-bezier(.2,.8,.2,1)"></div></div></div><div class="b"><div class="l" style="margin:0;width:230px"><b>Reveal Kachel .9s · ease-expo</b>--dur-reveal-tile</div><div class="tr"><div class="dot" style="animation-timing-function:cubic-bezier(.16,1,.3,1)"></div></div></div><div class="b"><div class="l" style="margin:0;width:230px"><b>Sheet .55s · ease-out</b>--dur-sheet</div><div class="tr"><div class="dot" style="animation-timing-function:cubic-bezier(.2,.8,.2,1)"></div></div></div></body></html>
