<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:#fff;color:var(--text-heading)}.g{display:grid;gap:12px}.sw{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(10,37,64,.06)}.l{font:500 11px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l b{display:block;font:600 12px/1.4 var(--font-sans);color:var(--text-heading)}body{background:#F6F9FC}.c{height:88px;border-radius:16px;background:#fff}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)"><div><div class="c" style="box-shadow:var(--shadow-card)"></div><div class="l"><b>Karte</b>var(--shadow-card)</div></div><div><div class="c" style="box-shadow:var(--shadow-card-hover)"></div><div class="l"><b>Karte Hover</b>var(--shadow-card-hover)</div></div><div><div class="c" style="box-shadow:var(--shadow-mock)"></div><div class="l"><b>Mockup</b>var(--shadow-mock)</div></div><div><div class="c" style="box-shadow:var(--focus-ring), inset 0 0 0 1px #635BFF"></div><div class="l"><b>Fokus-Ring</b>var(--focus-ring)</div></div></div></body></html>
