<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:#fff;color:var(--text-heading)}.g{display:grid;gap:12px}.sw{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(10,37,64,.06)}.l{font:500 11px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l b{display:block;font:600 12px/1.4 var(--font-sans);color:var(--text-heading)}.bar{height:56px;border-radius:12px}.t{font-weight:600;letter-spacing:-.04em;font-size:44px;line-height:1;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}</style></head><body><div class="g" style="grid-template-columns:1fr 1fr 1fr;align-items:end"><div><div class="bar" style="background:var(--mc-stream)"></div><div class="l"><b>--mc-stream</b>135°, Hero & Marke</div></div><div style="background:#0A1F44;border-radius:12px;padding:8px 14px 6px"><span class="t" style="background:var(--mc-stream-text-1)">0,25 ms</span><div class="l" style="color:#9DB1D2"><b style="color:#fff">--mc-stream-text-1…3</b>Große Zahlen, dunkel</div></div><div><div class="bar" style="position:relative;overflow:hidden;background:#F6F9FC"><div style="position:absolute;inset:-40%;filter:blur(24px);background:radial-gradient(42% 46% at 30% 36%,#FF5A8C,transparent),radial-gradient(46% 50% at 74% 28%,#FFB46B,transparent),linear-gradient(135deg,#FF5A8C,#C05CFF)"></div><div style="position:absolute;inset:0;background:linear-gradient(180deg,#fff,rgba(255,255,255,0) 60%)"></div></div><div class="l"><b>Kachel-Farbfeld</b>2 Radial-Ebenen, Blur 36, Weiß-Fade</div></div></div></body></html>
