<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:#fff;color:var(--text-heading)}.g{display:grid;gap:12px}.sw{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(10,37,64,.06)}.l{font:500 11px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l b{display:block;font:600 12px/1.4 var(--font-sans);color:var(--text-heading)}body{background:#0A1F44}.l{color:#9DB1D2}.l b{color:#fff}.sw{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="background:#0A1F44"></div><div class="l"><b>Dark</b>--mc-dark</div></div><div><div class="sw" style="background:#10285A"></div><div class="l"><b>Konsole</b>--mc-dark-2</div></div><div><div class="sw" style="background:#14275F"></div><div class="l"><b>Knoten</b>--mc-dark-3</div></div><div><div class="sw" style="background:#EEF1FA"></div><div class="l"><b>Text</b>--mc-dark-text</div></div><div><div class="sw" style="background:#9DB1D2"></div><div class="l"><b>Muted</b>--mc-dark-muted</div></div><div><div class="sw" style="background:#5FC3FF"></div><div class="l"><b>Akzent</b>--mc-dark-accent</div></div></div></body></html>
