<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:#fff;color:var(--text-heading)}.g{display:grid;gap:12px}.sw{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(10,37,64,.06)}.l{font:500 11px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l b{display:block;font:600 12px/1.4 var(--font-sans);color:var(--text-heading)}body{padding:0;background:#fff;overflow:hidden}canvas{display:block;width:700px;height:200px;image-rendering:pixelated}</style></head><body><canvas id="c" width="700" height="200"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d'),P=['#FFB46B','#FF5A8C','#C05CFF','#5FC3FF','#5FC3FF'];let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let px=0;px<700;px+=3){const cy=40+px*0.19;for(let py=0;py<200;py+=3){const d=Math.abs(py-cy)/(26+px*0.05);if(d>1)continue;if(r()>(1-d)*(1-d)*0.9)continue;x.fillStyle=P[Math.floor((px/700*4+r()*.6))%5];x.globalAlpha=.55+.45*(1-d);x.fillRect(px,py,3,3)}}</script></body></html>
