<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:#fff;color:var(--text-heading)}.g{display:grid;gap:12px}.sw{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(10,37,64,.06)}.l{font:500 11px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l b{display:block;font:600 12px/1.4 var(--font-sans);color:var(--text-heading)}.r{height:56px;background:#fff;box-shadow:0 0 0 1px #E3E8EE}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="r" style="border-radius:999px"></div><div class="l"><b>Pill 999px</b>--r-pill</div></div><div><div class="r" style="border-radius:20px"></div><div class="l"><b>Modal 20px</b>--r-modal</div></div><div><div class="r" style="border-radius:16px"></div><div class="l"><b>Kachel 16px</b>--r-card</div></div><div><div class="r" style="border-radius:12px"></div><div class="l"><b>Mockup 12px</b>--r-mock</div></div><div><div class="r" style="border-radius:8px"></div><div class="l"><b>Input 8px</b>--r-input</div></div><div><div class="r" style="border-radius:6px"></div><div class="l"><b>Chip 6px</b>--r-chip</div></div></div></body></html>
