<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:#fff;color:var(--text-heading)}.g{display:grid;gap:12px}.sw{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(10,37,64,.06)}.l{font:500 11px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l b{display:block;font:600 12px/1.4 var(--font-sans);color:var(--text-heading)}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="background:#425466"></div><div class="l"><b>Slate</b>--mc-slate</div></div><div><div class="sw" style="background:#727F96"></div><div class="l"><b>Muted</b>--mc-muted</div></div><div><div class="sw" style="background:#8898AA"></div><div class="l"><b>Mute 2</b>--mc-mute-2</div></div><div><div class="sw" style="background:#F6F9FC"></div><div class="l"><b>Surface</b>--mc-surface</div></div><div><div class="sw" style="background:#E3E8EE"></div><div class="l"><b>Line</b>--mc-line</div></div><div><div class="sw" style="background:#F0F3FA"></div><div class="l"><b>Line soft</b>--mc-line-soft</div></div></div></body></html>
