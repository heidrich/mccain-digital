<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:#fff;color:var(--text-heading)}.g{display:grid;gap:12px}.sw{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(10,37,64,.06)}.l{font:500 11px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l b{display:block;font:600 12px/1.4 var(--font-sans);color:var(--text-heading)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div><div class="sw" style="background:#15BE53"></div><div class="l"><b>Success</b>--mc-success</div></div><div><div class="sw" style="background:#0E8A4C"></div><div class="l"><b>Success Text</b>--mc-success-text</div></div><div><div class="sw" style="background:rgba(21,190,83,.14)"></div><div class="l"><b>Success Soft</b>--mc-success-soft</div></div><div><div class="sw" style="background:#FF7A45"></div><div class="l"><b>Check</b>--mc-check</div></div><div><div class="sw" style="background:#E5484D"></div><div class="l"><b>Danger</b>--mc-danger</div></div></div></body></html>
